page-col: "#FAF8F4"
text-col: "#2C2C2C"
link-col: "#C1440E"
hover-col: "#1B4332"

navbar-col: "#1B4332"
navbar-text-col: "#F5F0E8"
navbar-border-col: "#143326"

footer-col: "#1B4332"
